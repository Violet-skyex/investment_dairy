<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Portfolio Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1 id="page-title">Dashboard</h1>
      <div id="header-actions"></div>
    </header>

    <main id="main-content">
      <div class="empty" id="loading-state">
        <div class="spinner" style="margin:0 auto 12px"></div>
        <div class="empty-sub">Loading…</div>
      </div>
    </main>

    <nav id="bottom-nav">
      <button class="nav-btn active" data-tab="dashboard">
        <span class="nav-icon">⬡</span>
        <span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-btn" data-tab="positions">
        <span class="nav-icon">▤</span>
        <span class="nav-label">Positions</span>
      </button>
      <button class="nav-btn" data-tab="predictions">
        <span class="nav-icon">◈</span>
        <span class="nav-label">Predict</span>
      </button>
      <button class="nav-btn" data-tab="journal">
        <span class="nav-icon">✎</span>
        <span class="nav-label">Journal</span>
      </button>
      <button class="nav-btn" data-tab="history">
        <span class="nav-icon">↕</span>
        <span class="nav-label">History</span>
      </button>
    </nav>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-container">
      <div class="modal-handle"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Hidden file input for CSV upload -->
  <input type="file" id="file-input" class="file-input" accept=".csv" multiple>

  <!-- PapaParse (bundled locally — no CDN dependency) -->
  <script src="js/papaparse.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
